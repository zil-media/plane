worker_processes 4;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  default_type  application/octet-stream;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forwarded-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  access_log /dev/stdout;
  error_log /dev/stderr;

  server {
    listen 3000;

    # Never emit absolute redirects: nginx's automatic "append trailing slash"
    # 301 for a directory would otherwise leak the internal listen port (:3000)
    # and downgrade https->http behind the proxy. Keep redirects relative.
    absolute_redirect off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # This is a pure static SPA file server, so the ONLY way it can emit a 403
    # is nginx trying to serve a directory that has no index file (autoindex is
    # off) — which happens when a client-side route collides with a real folder
    # shipped under public/ (favicon, icons, plane-logos, brand, …) whose name
    # equals a workspace slug. Remap that 403 to the SPA shell so any such
    # slug↔directory collision serves the app (200) instead of a raw nginx 403.
    # There is no auth/deny in this server, so no legitimate 403 is masked.
    error_page 403 = /index.html;

    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;
    }
  }
}

