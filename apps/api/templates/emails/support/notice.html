<!DOCTYPE html>
<html lang="es">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ heading }}</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f5f7; font-family: Arial, Helvetica, sans-serif">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f5f7">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 560px; background-color: #ffffff; border-radius: 8px"
          >
            <tr>
              <td style="padding: 32px 32px 8px 32px">
                <h1 style="margin: 0; font-size: 20px; line-height: 28px; color: #1f2328">{{ heading }}</h1>
              </td>
            </tr>
            {% for paragraph in paragraphs %}
            <tr>
              <td style="padding: 8px 32px; font-size: 15px; line-height: 23px; color: #3a3f45">
                {{ paragraph|linebreaksbr }}
              </td>
            </tr>
            {% endfor %}
            {% if cta_url %}
            <tr>
              <td style="padding: 16px 32px 8px 32px">
                <a
                  href="{{ cta_url }}"
                  style="
                    display: inline-block;
                    padding: 10px 18px;
                    background-color: #1f2328;
                    color: #ffffff;
                    text-decoration: none;
                    border-radius: 6px;
                    font-size: 14px;
                  "
                  >{{ cta_label|default:"Abrir" }}</a
                >
              </td>
            </tr>
            {% endif %}
            <tr>
              <td style="padding: 24px 32px 32px 32px; font-size: 14px; line-height: 22px; color: #6b7178">
                Equipo de Zil Support
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
