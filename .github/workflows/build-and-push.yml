name: build-and-push

# Publishes the images Watchtower deploys on the NAS (tag `preview`). Rollback: rollback.yml,
# runbook in docs/ops-deploy.md.
#
# A push to preview deploys only once Preview CI is green on that same commit (workflow_run).
# The agent lanes merge with GITHUB_TOKEN, which starts no workflow (Preview CI included), after
# running the same bar themselves (.github/ci/agent-lane/gates.sh), so they start this one with
# workflow_dispatch (.github/ci/agent-lane/trigger-deploy.sh). A manual run does the same; with
# `all` it rebuilds every image.
on:
  workflow_run:
    workflows: ["Preview CI"]
    types: [completed]
    branches: [preview]
  workflow_dispatch:
    inputs:
      all:
        description: Rebuild every image, not only the changed ones
        type: boolean
        default: false

# Runs queue instead of cancelling each other. GitHub keeps only the newest pending run, which is
# fine: every run diffs from the last commit that was published completely (ops-deploy/built),
# so the replaced run's changes are built by the one that replaced it.
concurrency:
  group: build-and-push-preview
  cancel-in-progress: false

jobs:
  changes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      sha: ${{ steps.pick.outputs.sha }}
      deploy: ${{ steps.pick.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: pick
        name: Pick the images to build
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all }}
        run: |
          BASE=$(git rev-parse -q --verify 'refs/tags/ops-deploy/built^{commit}' || true)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          set +e
          MATRIX=$(BASE="$BASE" bash .github/ci/build-matrix.sh)
          code=$?
          set -e
          if [ "$code" = 3 ]; then echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "matrix=[]" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$code" = 0 ] || exit "$code"
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.deploy == 'true' && needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the ops-deploy/backend tag
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      SHA: ${{ needs.changes.outputs.sha }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `previous` = what is live before this build, so rollback.yml can put it back in one step.
      # A re-run of the commit already live keeps the older `previous`.
      - name: Keep the live image as previous
        run: |
          if LIVE=$(docker buildx imagetools inspect "$IMAGE:preview" --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null); then
            if [ "$LIVE" != "$SHA" ]; then
              docker buildx imagetools create -t "$IMAGE:previous" "$IMAGE:preview"
              echo "previous = $LIVE"
            else
              echo "preview already is $SHA: previous left as is"
            fi
          else
            echo "no preview image yet"
          fi
      - id: short
        run: echo "sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=preview
            type=raw,value=sha-${{ steps.short.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.changes.outputs.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # the backend reports it at /api/zil/sync/version/; only built when apps/api changes
          build-args: |
            GIT_SHA=${{ needs.changes.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # Zil's ops-deploy-check compares this tag with the sha the running API reports.
      - name: Record the published backend
        if: matrix.image == 'plane-backend'
        run: git push --force origin "$SHA:refs/tags/ops-deploy/backend"

  # Advanced only when every picked image was published: the next run diffs from here.
  record:
    needs: [changes, build]
    if: >-
      always() && needs.changes.result == 'success' && needs.changes.outputs.deploy == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - name: Record the published commit
        run: git push --force origin "${{ needs.changes.outputs.sha }}:refs/tags/ops-deploy/built"
