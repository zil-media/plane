name: Preview CI

# Quality bar for `preview`, the branch that deploys to production
# (build-and-push.yml -> GHCR -> Watchtower). The agent lanes run this same bar
# before they merge anything, so it has to stay green on `preview` itself.
#
# Every gate runs even when an earlier one failed (`!cancelled()`), so a single
# run reports all the problems at once, and each gate goes through
# .github/ci/gate.sh, which surfaces failures as annotations readable without
# signing in to GitHub.

on:
  push:
    branches: [preview]
  pull_request:
    branches: [preview]
  workflow_dispatch: {}

concurrency:
  group: preview-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same version as requirements/local.txt.
      - run: pip install ruff==0.9.7
      - run: bash .github/ci/gate.sh "ruff" ruff check apps/api

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Tagged with the name docker-compose-test.yml expects, so `compose run`
      # uses this cached build instead of rebuilding from scratch.
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.dev
          tags: plane-api-tests:latest
          load: true
          cache-from: type=gha,scope=api-tests
          cache-to: type=gha,mode=max,scope=api-tests

      - name: Test env file
        id: env
        run: |
          cp apps/api/.env.example apps/api/.env
          echo "SECRET_KEY=\"ci-$(openssl rand -hex 24)\"" >> apps/api/.env

      - name: Migrations match the models
        if: ${{ !cancelled() && steps.env.outcome == 'success' }}
        run: >-
          bash .github/ci/gate.sh "makemigrations --check"
          docker compose -f docker-compose-test.yml run --rm api-tests
          python manage.py makemigrations --check --dry-run

      - name: Pytest
        if: ${{ !cancelled() && steps.env.outcome == 'success' }}
        run: >-
          bash .github/ci/gate.sh "pytest"
          docker compose -f docker-compose-test.yml run --rm api-tests
          pytest -p no:cacheprovider -o addopts="--strict-markers --reuse-db --nomigrations" -q -rfE --disable-warnings

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose-test.yml down -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from the `packageManager` field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash .github/ci/gate.sh "format" pnpm check:format
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash .github/ci/gate.sh "lint" pnpm check:lint
      - name: Types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash .github/ci/gate.sh "types" pnpm check:types
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash .github/ci/gate.sh "build" pnpm build

  # Every agent push gates against preview, so a red preview freezes both lanes: file it as a
  # blocking bug and the fixer routine picks it up.
  report-red:
    needs: [backend-lint, backend-tests, frontend]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
      API_URL: ${{ secrets.AGENT_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: File a blocking bug
        run: |
          SUBJECT=$(git log -1 --format='%h %s' "${GITHUB_SHA}" | cut -c1-200)
          bash .github/ci/agent-lane/report-incident.sh preview-red preview \
            "The Preview CI bar fails on the tip of preview (${SUBJECT}). Every agent push gates against preview, so both lanes are stuck until it is green again."
