name: Preview CI

# Quality bar for `preview`, the branch that deploys to production
# (build-and-push.yml -> GHCR -> Watchtower). The agent lanes run this same bar
# before they merge anything, so it has to stay green on `preview` itself.

on:
  push:
    branches: [preview]
  pull_request:
    branches: [preview]
  workflow_dispatch: {}

concurrency:
  group: preview-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same version as requirements/local.txt.
      - run: pip install ruff==0.9.7
      - run: ruff check apps/api

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Tagged with the name docker-compose-test.yml expects, so `compose run`
      # uses this cached build instead of rebuilding from scratch.
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.dev
          tags: plane-api-tests:latest
          load: true
          cache-from: type=gha,scope=api-tests
          cache-to: type=gha,mode=max,scope=api-tests

      - name: Test env file
        run: |
          cp apps/api/.env.example apps/api/.env
          echo "SECRET_KEY=\"ci-$(openssl rand -hex 24)\"" >> apps/api/.env

      - name: Migrations match the models
        run: docker compose -f docker-compose-test.yml run --rm api-tests python manage.py makemigrations --check --dry-run

      - name: Pytest
        run: docker compose -f docker-compose-test.yml run --rm api-tests pytest -p no:cacheprovider

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose-test.yml down -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from the `packageManager` field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm check:format
      - run: pnpm check:lint
      - run: pnpm check:types
      - run: pnpm build
